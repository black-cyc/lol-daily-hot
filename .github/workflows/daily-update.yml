name: Update daily LOL trends

on:
  schedule:
    # 09:00 Asia/Shanghai = 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-lol-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Collect and publish daily data
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
          DOUYIN_HOT_API_URL: ${{ vars.DOUYIN_HOT_API_URL }}
          DOUYIN_SEARCH_API_URL: ${{ vars.DOUYIN_SEARCH_API_URL }}
          DOUYIN_API_TOKEN: ${{ secrets.DOUYIN_API_TOKEN }}
        run: python pipeline/run.py

      - name: Commit changed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data pipeline/data/history.sqlite3
          git diff --cached --quiet || git commit -m "chore: update daily LOL trends"
          git push
